# Helm-lite reference. Apply from the repository:
#   kubectl apply -k deploy/enterprise/k8s
# Cloud-neutral: no EKS / GKE / AKS annotations. Provider notes live in
# docs/enterprise/packaging.md only. Example secret manifests are not applied.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: agenttwin-enterprise
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
images:
  - name: agenttwin-enterprise-api
    newTag: local
