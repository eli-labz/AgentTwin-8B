site_name: MatrAIx Handbook
site_description: >-
  Documentation for MatrAIx — a population-scale, persona-driven infrastructure
  for evaluating AI systems and interactive products with simulated users.
repo_url: https://github.com/MatrAIx-ai/MatrAIx
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

nav:
  - Home: README.md
  - Start here:
      - Quickstart: quickstart.md
      - Configuration: configuration.md
  - Persona:
      - Overview: persona/README.md
      - Pipeline: persona/pipeline.md
      - Validation: persona/validation.md
  - Application:
      - Overview: application/README.md
      - Task guide: application/task-guide.md
      - Playground API: application/playground-api.md
  - Environment:
      - Overview: environment/README.md
      - Agents: environment/agents.md
      - Web interaction: environment/web-interaction.md
      - Runtime: environment/runtime.md
      - Large-scale runs: environment/large-scale-runs.md
  - Packages: packages.md
  - Enterprise:
      - Repository audit: enterprise/REPOSITORY_AUDIT.md
      - Implementation baseline: enterprise/IMPLEMENTATION_BASELINE.md
      - Build report: enterprise/BUILD_REPORT.md
      - Threat model: enterprise/THREAT_MODEL.md
      - Target architecture: enterprise/TARGET_ARCHITECTURE.md
      - Domain model: enterprise/DOMAIN_MODEL.md
      - Security model: enterprise/SECURITY_MODEL.md
      - Governance: enterprise/GOVERNANCE.md
      - Implementation roadmap: enterprise/IMPLEMENTATION_ROADMAP.md
  - ADR:
      - 0001 Platform boundaries: adr/0001-enterprise-platform-boundaries.md
      - 0002 Persistence and record store: adr/0002-persistence-and-record-store.md
      - 0003 Tenant isolation enforcement: adr/0003-tenant-isolation-enforcement.md
      - 0004 Authorization model: adr/0004-authorization-model.md
      - 0005 Audit strategy: adr/0005-audit-strategy.md
      - 0006 Population immutability: adr/0006-population-immutability.md
